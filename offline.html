<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brak połączenia - mObywatel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--bg), #1e3a8a);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 420px);
      background: rgba(17,24,39,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
      text-align: center;
    }
    .emoji { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 8px 0; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📶</div>
    <h1>Brak połączenia z siecią</h1>
    <p>Sprawdź połączenie internetowe i spróbuj ponownie. Niektóre treści mogą być dostępne z pamięci podręcznej aplikacji.</p>
    <button onclick="window.location.reload()">Spróbuj ponownie</button>
  </div>
</body>
</html>
